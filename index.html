<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>座禅チェック</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main id="app">
      <canvas id="view" aria-label="カメラ映像"></canvas>
      <video id="video" playsinline muted></video>

      <header id="top">
        <div id="badge" class="badge" aria-live="polite" aria-label="判定結果"></div>
        <p id="status">カメラを起動しています…</p>
      </header>

      <footer id="bottom">
        <button id="switch" type="button">カメラ切替</button>
        <button id="debug" type="button">詳細</button>
      </footer>
      <pre id="details" hidden></pre>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
